site_name: TFF e.V. Tesla Übergabe-Guide
site_description: Leitfaden für neue Tesla-Besitzer & Erst-Setup
site_url: https://fhiel.github.io/TFFeV-Guide/
copyright: "Copyright &copy; 2026 TFF e.V. Supporter Team &bull; Lizenziert unter MIT License"

extra:
  manifest: 'assets/manifest.webmanifest'

nav:
  - Übersicht: index.md
  - Impressum & Datenschutz: impressum.md

theme:
  name: material
  language: de
  favicon: assets/logo.png    # Pfad zu eurem Logo/Icon
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.tracking

theme:
  name: material
  language: de
  palette:
    # Automatische Anpassung an das System des Smartphones/Browsers
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: An Systemdesign anpassen
    # Hellmodus (Fallback)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    # Dunkelmodus (Fallback)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      
  features:
    - navigation.instant      # Schnelleres Laden ohne Refresh
    - navigation.top          # "Nach oben"-Button
    - navigation.footer       # Footer-Navigation
    - navigation.tracking     # Analytics Tracking
    - content.action.edit     # Edit-Link (optional)

plugins:
  - search                    # Suchfunktion aktivieren
  - offline                   # PWA / Offline-Funktionalität
  - git-revision-date-localized:
      type: date
      locale: de

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.tasklist:        # Ermöglicht [-] Checkboxen
      custom_checkbox: true
  - pymdownx.superfences      # Verbesserter Code- & Tabellenblock-Support
  - pymdownx.details          # Ausklappbare Infoboxen
  - pymdownx.tabbed:
      alternate_style: true

# Custom CSS einbinden:
extra_css:
  - stylesheets/extra.css
  
extra_javascript:
  - javascripts/checklists.js