site_name: TFF e.V. Tesla Übergabe-Guide
site_description: Leitfaden für neue Tesla-Besitzer & Erst-Setup
site_url: https://fhiel.github.io/TFFeV-Guide/
copyright: "Copyright &copy; 2026 TFF e.V. Supporter Team &bull; Lizenziert unter MIT License"

extra:
  manifest: 'assets/manifest.webmanifest'

nav:
  - Übersicht: index.md
  - Impressum & Datenschutz: impressum.md

theme:
  name: material
  language: de
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # 1. Helles Design
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Design wechseln

    # 2. Dunkles Design (Slate)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Zum hellen Design wechseln

  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.action.edit

plugins:
  - search
  - offline
  - git-revision-date-localized:
      type: date
      locale: de

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: false
      clickable_checkbox: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/checklists.js